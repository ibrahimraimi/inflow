name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint-and-format:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Biome lint
        run: bun run lint

      - name: Check formatting
        run: bun run format

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun turbo lint:types

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [lint-and-format, type-check]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node Next.js Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.turbo
            ${{ github.workspace }}/apps/web/.next/cache
            ${{ github.workspace }}/apps/api/.next/cache
          key: ${{ runner.os }}-turbo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ github.ref_name }}-
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          NEXT_PUBLIC_APP_URL: https://inflow.ibrahimraimi.com
          BETTER_AUTH_SECRET: placeholder-secret-for-build
          BETTER_AUTH_URL: https://inflow.ibrahimraimi.com

      - name: Upload web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build-artifacts
          path: apps/web/.next/
          retention-days: 7

      - name: Upload api build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: api-build-artifacts
          path: apps/api/.next/
          retention-days: 7
